# Root-level SonarQube config (used when scanning the whole monorepo as one project)
sonar.projectKey=sonar-monorepo
sonar.projectName=Sonar Monorepo
sonar.projectVersion=1.0

# Aggregates all subproject sources
sonar.sources=packages/utils/src,packages/api/src,packages/frontend/src
sonar.tests=packages/utils/tests,packages/api/tests,packages/frontend/tests

sonar.javascript.lcov.reportPaths=\
  packages/utils/coverage/lcov.info,\
  packages/api/coverage/lcov.info,\
  packages/frontend/coverage/lcov.info
